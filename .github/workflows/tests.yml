name: Airflow DAG tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Airflow and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the custom Airflow image
        run: docker build -t wholesale-airflow:3.3.2 .

      - name: Check the DAG packages import inside the image
        run: docker run --rm --entrypoint python wholesale-airflow:3.3.2 -c "import sklearn, kneed, matplotlib, pandas; print('ok')"
